name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit-test:
    name: unittest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.11", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 确认没有第三方依赖
        run: python -c "import subs, panel; print('import ok, no deps')"
        working-directory: .
      - name: 语法检查
        run: python -m py_compile subs.py panel.py
      - name: 跑单元测试
        run: python -m unittest discover -s tests -t . -v
